let homeBackdrop=homeArt;
function homeWave(clock=Date.now()){
 const count=24,height=240/count,phase=Math.PI*2*(clock%18000)/18000;
 let defs='',body='';
 for(let i=0;i<count;i++){
  const id='homeWave'+i,dy=i*height,offset=1.25*Math.sin(phase+i*.20);
  defs+=`<clipPath id="${id}"><rect x="0" y="${dy}" width="400" height="${height+.15}"/></clipPath>`;
  body+=`<image href="${homeBackdrop}" x="${-2+offset}" y="0" width="404" height="240" style="image-rendering:pixelated" clip-path="url(#${id})"/>`;
 }
 return `<defs>${defs}</defs><g data-home-wave="true">${body}</g>`;
}

function prepareHomeBackdrop(){if(typeof Image==='undefined')return;let source=new Image();source.onload=()=>{let canvas=document.createElement('canvas');canvas.width=400;canvas.height=240;let context=canvas.getContext('2d');let smaller=document.createElement('canvas');smaller.width=200;smaller.height=120;let sm=smaller.getContext('2d');sm.imageSmoothingEnabled=true;sm.imageSmoothingQuality='high';sm.drawImage(source,0,0,200,120);context.imageSmoothingEnabled=false;context.drawImage(smaller,0,0,400,240);homeBackdrop=canvas.toDataURL('image/png');render()};source.src=homeArt}
let lifeMotion=[],rollingTextId=0,newReturnPage='home';
function displayedLife(i){let m=lifeMotion[i];if(!m)return state.game.players[i].life;let t=Math.max(0,Math.min(1,m.duration?(Date.now()-m.start)/m.duration:1));return m.from+(m.target-m.from)*(1-(1-t)**3)}
